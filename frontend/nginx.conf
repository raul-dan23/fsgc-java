server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls are reverse-proxied to the backend container (same origin for the SPA).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # timetable generation / "compare budgets" can run for a while
        proxy_connect_timeout 600s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        # allow multi-MB Excel uploads
        client_max_body_size  25m;
    }

    # SPA fallback: any non-file route serves index.html (React Router handles it)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
